name: Free Browser Gameplay Test
on:
  push:
    paths:
      - 'parking/**'
      - 'enhanced/**'
      - 'challenge/**'
      - 'random/**'
      - 'timed/**'
      - 'tests/play_enhanced.py'
      - 'tests/play_game.py'
      - 'tests/play_random.py'
      - 'tests/play_timed.py'
      - '.github/workflows/gameplay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start local game server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/game-server.log 2>&1 &
          sleep 2
      - name: Play all 24 levels using Chromium
        run: python tests/play_game.py
      - name: Play enhanced 10 levels using Chromium
        run: python tests/play_enhanced.py
      - name: Play random seed challenges in Chromium
        run: python tests/play_random.py
      - name: Play fixed M1/M2 and timed challenge acceptance
        run: python tests/play_timed.py
      - name: Upload screenshot and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-screenshots
          path: test-results/
          if-no-files-found: ignore
