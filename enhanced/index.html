    highlight = "";
    if (won(level(), state())) {
      if (!save.completed.includes(level().level_id)) save.completed.push(level().level_id);
      record("level_complete");
    } else if (trapped(level(), state()).length) record("wrong_order");
    persist();
    const horizontal = ["E", "W"].includes(c.direction), x0 = ox2 + c.x * 52 + 4, y0 = oy2 + c.y * 52 + 4, w = (horizontal ? c.length : 1) * 52 - 8, h = (horizontal ? 1 : c.length) * 52 - 8, distance = { E: ox2 + 312 - x0 + 4, W: x0 + w - ox2 + 4, S: oy2 + 312 - y0 + 4, N: y0 + h - oy2 + 4 }[c.direction];
    moving = { car: c, start: Date.now(), before, distance };
    frame();
  });
  $("restart").onclick = () => {
    cancel();
    save.removed = [];
    message = "\u5DF2\u91CD\u5F00\u3002K \u79BB\u573A\u524D\u5148\u9001\u8981\u8FC7\u95F8\u7684\u8F66\u3002";
    persist();
    record("restart");
    render();
  };
  $("hint").onclick = () => {
    record("hint");
    const path = solution(level(), state());
    highlight = path?.[0] || "";
    message = path?.length ? `\u514D\u8D39\u63D0\u793A\uFF1A\u5148\u70B9 ${path[0]}\u3002\u767D\u6846\u8F66\u6709\u53EF\u89E3\u7684\u540E\u7EED\u3002` : won(level(), state()) ? "\u5DF2\u7ECF\u6E05\u7A7A" : "\u9053\u95F8\u56F0\u4F4F\u4E86\u8F66\uFF0C\u8BF7\u91CD\u5F00\u3002";
    render();
  };
  $("next").onclick = () => {
    if (won(level(), state()) && !moving) {
      if (save.current < levels.length - 1) choose(save.current + 1, "next_level");
      else {
        message = "\u5341\u5173\u4F53\u9A8C\u5B8C\u6210\uFF0C\u6B22\u8FCE\u7559\u4E0B\u672C\u673A\u53CD\u9988\u3002";
        $("form").showModal();
        render();
      }
    }
  };
  $("choose").innerHTML = levels.map((l, i) => `<option value="${i}">${i + 1}. ${l.title}</option>`).join("");
  $("choose").onchange = (e) => choose(Number(e.target.value), "level_select");
  function lifecycle(hidden) {
    const wasPaused = paused;
    paused = hidden;
    if (hidden) sound.pause();
    cancel();
    persist();
    if (!hidden && wasPaused) message = "\u7EE7\u7EED\u89C2\u5BDF\u8C01\u9700\u8981\u5728 K \u524D\u79BB\u5F00\u3002";
    render();
  }
  document.addEventListener("visibilitychange", () => lifecycle(document.hidden));
  document.addEventListener("freeze", () => lifecycle(true));
  document.addEventListener("resume", () => lifecycle(document.hidden));
  window.addEventListener("pagehide", () => lifecycle(true));
  window.addEventListener("pageshow", () => lifecycle(document.hidden));
  $("feedback").onclick = () => {
    $("form").showModal();
  };
  $("closeFeedback").onclick = () => $("form").close();
  function feedbackText() {
    return ["\u6536\u5DE5\u843D\u95F8 \xB7 \u5341\u5173\u8BD5\u73A9 v1", `\u6570\u636E\u6765\u6E90\uFF1A${test ? "\u81EA\u52A8\u6D4B\u8BD5\uFF08\u4E0D\u8BA1\u771F\u4EBA\uFF09" : "\u672C\u673A\u8BB0\u5F55\uFF0C\u672A\u6838\u5B9E\u771F\u4EBA"}`, `\u5B8C\u6210\uFF1A${save.completed.length}/10`, ...["understand", "again", "stuck", "feeling"].map((id) => `${$(id).dataset.label}\uFF1A${$(id).selectedOptions[0].textContent}`), "\u672C\u673A\u4E8B\u4EF6\uFF08\u65E0\u59D3\u540D\u3001\u8D26\u53F7\u3001\u8BBE\u5907\u6807\u8BC6\uFF1B\u672A\u81EA\u52A8\u4E0A\u4F20\uFF09\uFF1A", ...events.map((e) => `${e.elapsedSeconds}s ${e.level} ${e.event} ${e.source}`)].join("\n");
  }
  $("export").onclick = () => {
    $("exportText").value = feedbackText();
    $("exportBox").hidden = false;
  };
  $("copy").onclick = async () => {
    try {
      await navigator.clipboard.writeText($("exportText").value);
      $("copied").textContent = "\u5DF2\u590D\u5236\uFF0C\u53EF\u81EA\u884C\u53D1\u9001\u7ED9\u63D0\u4F9B\u8BD5\u73A9\u94FE\u63A5\u7684\u4EBA\u3002";
    } catch {
      $("copied").textContent = "\u8BF7\u9009\u62E9\u4E0A\u65B9\u6587\u5B57\u590D\u5236\u3002";
      $("exportText").select();
    }
  };
  record("level_start");
  persist();
  render();
})();
</script></html>
