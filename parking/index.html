      const c = board.cars.find((c2) => gx >= c2.x && gy >= c2.y && gx < c2.x + (["E", "W"].includes(c2.direction) ? c2.length : 1) && gy < c2.y + (["N", "S"].includes(c2.direction) ? c2.length : 1));
      if (!c) return;
      const next = remove(board, c.id);
      if (next === board) {
        message = `${c.id} \u524D\u9762\u6709\u8F66\uFF0C\u5148\u8BA9\u5176\u4ED6\u8F66\u79BB\u5F00`;
        highlight = c.id;
        bad = true;
      } else {
        board = next;
        highlight = "";
        bad = false;
        lockedUntil = Date.now() + 140;
        state.removed.push(c.id);
        message = `${c.id} \u5DF2\u4E0B\u73ED\uFF01`;
        if (state.vibration) try {
          host.feedback?.();
        } catch {
        }
        if (!board.cars.length) {
          state.completed = Math.max(state.completed, state.current + 1);
          message = "\u6E05\u573A\u5B8C\u6210\uFF01\u70B9\u51FB\u4E0B\u4E00\u5173";
        }
        persist();
      }
      draw();
    });
    host.lifecycle?.((hidden) => {
      paused = hidden;
      lockedUntil = 0;
      persist();
      draw();
    });
    draw();
  }

  // src/platform/web.ts
  var canvas = document.querySelector("canvas");
  canvas.width = 360;
  canvas.height = 640;
  start({
    canvas,
    load: () => localStorage.getItem("nc-mg-001"),
    save: (s) => localStorage.setItem("nc-mg-001", s),
    feedback: () => navigator.vibrate?.(20),
    lifecycle: (fn) => {
      document.addEventListener("freeze", () => fn(true));
      document.addEventListener("resume", () => fn(document.hidden));
      document.addEventListener("visibilitychange", () => fn(document.hidden));
      window.addEventListener("pagehide", () => fn(true));
      window.addEventListener("pageshow", () => fn(document.hidden));
    },
    input: (fn) => {
      canvas.addEventListener("pointerdown", (e) => {
        if (!e.isPrimary || e.button !== 0) return;
        e.preventDefault();
        const r = canvas.getBoundingClientRect();
        fn((e.clientX - r.left) * 360 / r.width, (e.clientY - r.top) * 640 / r.height);
      });
    }
  });
})();
</script></html>
